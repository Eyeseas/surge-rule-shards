name: Update public rule shards
on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
permissions:
  contents: write
concurrency:
  group: update-public-rules
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download, split and verify both sources
        run: python3 scripts/update_rules.py
      - name: Commit verified public data
        run: |
          git add rules sources manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified public rule shards'
          git push
